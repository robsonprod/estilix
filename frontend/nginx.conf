server {
    listen 80;
    root /usr/share/nginx/html;

    # Strict CSP: no inline scripts; tokens live in sessionStorage, so XSS is the risk to close.
    # connect-src lists the API (same origin) and the local identity provider.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:8090; frame-ancestors 'none'; base-uri 'self'; form-action 'self' http://localhost:8090" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        # Overwrite (never append): the API trusts this header only from us, for per-IP rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /config.json {
        add_header Cache-Control "no-cache" always;
    }

    # Hashed bundles can be cached forever; index.html never.
    location ~* \.(js|css|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Prerendered public pages (/ and /planos) are served as files; every app route gets the client shell.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html /index.csr.html;
    }
}
